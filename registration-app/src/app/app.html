<div class="page">

  <div class="registration-card">

    <div class="header">
      <h1>Create Account</h1>
      <p>Register your details</p>
    </div>

    <form (ngSubmit)="registerUser()">

      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name</label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="user.name"
          placeholder="Enter your full name"
          required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="user.email"
          placeholder="Enter your email"
          required>
      </div>

      <!-- Mobile -->
      <div class="form-group">
        <label for="mobile">Mobile Number</label>

        <input
          id="mobile"
          type="tel"
          name="mobile"
          [(ngModel)]="user.mobile"
          placeholder="Enter your mobile number"
          maxlength="15"
          required>
      </div>

      <!-- Age and DOB -->
      <div class="row">

        <div class="form-group">
          <label for="age">Age</label>

          <input
            id="age"
            type="number"
            name="age"
            [(ngModel)]="user.age"
            placeholder="Age"
            min="1"
            max="120"
            required>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>

          <input
            id="dob"
            type="date"
            name="date_of_birth"
            [(ngModel)]="user.date_of_birth"
            required>
        </div>

      </div>

      <!-- Gender -->
      <div class="form-group">
        <label for="gender">Gender</label>

        <select
          id="gender"
          name="gender"
          [(ngModel)]="user.gender"
          required>

          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>

        </select>
      </div>

      <!-- Submit -->
      <button type="submit">
        Register
      </button>

      <!-- Success -->
      @if (message) {
        <div class="success">
          {{ message }}
        </div>
      }

      <!-- Error -->
      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

    </form>

  </div>

</div>
